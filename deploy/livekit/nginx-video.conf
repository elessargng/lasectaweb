# nginx: publica LiveKit con TLS en wss://video.<dominio> (ver docs/videollamada.md).
# Copiar a /etc/nginx/sites-available/, cambiar el dominio, activar y pedir el certificado:
#   sudo certbot --nginx -d video.<dominio>
server {
    listen 80;
    server_name video.example.com;

    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        # WebSocket (la señalización de LiveKit)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}
